name: Build Blog Application

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: mbstring, ctype, filter, hash, iconv, pdo, pdo_mysql, gd
      
    - name: Install dependencies
      run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress
      
    - name: Create database structure template
      run: |
        cat > database.sql << 'EOF'
-- BlogMe Database Structure
-- This is a template - import this SQL then run your application

CREATE TABLE IF NOT EXISTS users (
    id INT AUTO_INCREMENT PRIMARY KEY,
    username VARCHAR(50) UNIQUE NOT NULL,
    email VARCHAR(100) UNIQUE NOT NULL,
    password VARCHAR(255) NOT NULL,
    role ENUM('admin','author') DEFAULT 'author',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE IF NOT EXISTS posts (
    id INT AUTO_INCREMENT PRIMARY KEY,
    title VARCHAR(255) NOT NULL,
    content TEXT NOT NULL,
    author_id INT NOT NULL,
    status ENUM('published','draft') DEFAULT 'draft',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Add your actual database structure here after first deployment
EOF
        echo "✅ Database template created"
      
    - name: Create package
      run: |
        zip -r blog-package.zip . -x "*.git*" "*.github*" "README.md" "composer.lock"
        
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: blog-package
        path: |
          blog-package.zip
          database.sql
