name: Build PHP Application

on:
  push:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: mbstring, ctype, filter, hash, iconv
        
    - name: Install dependencies
      run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress
      
    - name: Create deployment package
      run: |
        # Remove development files
        rm -f composer.lock
        rm -rf tests/ 2>/dev/null || true
        
        # Create ZIP (excluding .git and other unnecessary files)
        zip -r deployment-package.zip . -x "*.git*" "*.github*" "README.md" "*.txt" "*.md" "composer.json"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: php-app
        path: deployment-package.zip
        retention-days: 30
