name: Build and Package PHP Application

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    name: Build PHP Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: mbstring, ctype, filter, hash, iconv, openssl
        coverage: none
        
    - name: Validate composer.json and composer.lock
      run: composer validate --strict
      
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-
          
    - name: Install dependencies
      run: composer install --prefer-dist --no-dev --optimize-autoloader --no-progress
      
    - name: Create deployment package
      run: |
        # Create temporary directory for packaging
        mkdir -p package
        
        # Copy necessary files (adjust according to your project structure)
        cp -r vendor package/
        cp -r src package/ 2>/dev/null || true
        cp -r public package/ 2>/dev/null || true
        cp -r config package/ 2>/dev/null || true
        cp -r templates package/ 2>/dev/null || true
        cp -r views package/ 2>/dev/null || true
        
        # Copy essential files
        cp composer.json package/ 2>/dev/null || true
        cp composer.lock package/ 2>/dev/null || true
        cp .env.example package/ 2>/dev/null || true
        cp index.php package/ 2>/dev/null || true
        
        # Remove development files if any were copied
        rm -f package/composer.lock
        
    - name: Create ZIP archive
      run: |
        cd package
        zip -r ../deployment-package.zip ./
        cd ..
        
    - name: Upload deployment package
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: deployment-package.zip
        retention-days: 30
        
    - name: Create release asset (on tag)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./deployment-package.zip
        asset_name: deployment-package-${{ github.ref_name }}.zip
        asset_content_type: application/zip

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security check
      uses: symfonycorp/security-checker-action@v4

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: mbstring, ctype, filter, hash, iconv, openssl
        coverage: xdebug
        
    - name: Install dependencies
      run: composer install --prefer-dist --optimize-autoloader --no-progress
      
    - name: Execute tests
      run: vendor/bin/phpunit --version || echo "No PHPUnit configured"
