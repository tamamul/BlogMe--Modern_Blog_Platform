name: Build Blog Application

on:
  push:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: mbstring, ctype, filter, hash, iconv, pdo, pdo_mysql, gd
      
    - name: Install dependencies
      run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress
      
    - name: Install MySQL Client
      run: sudo apt-get update && sudo apt-get install -y mysql-client
      
    - name: Generate Database Dump
      run: |
        echo "🗃️ Generating database dump from production..."
        mysqldump \
          -h "$DB_HOST" \
          -u "$DB_USER" \
          -p"$DB_PASS" \
          --single-transaction \
          --routines \
          --triggers \
          "$DB_NAME" > database.sql
          
        echo "✅ Database dump: $(ls -lh database.sql)"
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        
    - name: Create .env from example
      run: |
        if [ -f ".env.example" ]; then
          cp .env.example .env
          echo "✅ .env file created"
        else
          echo "⚠️  .env.example not found"
        fi
        
    - name: Create uploads directory structure
      run: |
        mkdir -p assets/images/uploads
        mkdir -p assets/images/avatars
        
    - name: Create deployment package
      run: |
        zip -r deployment-package.zip . \
          -x "*.git*" \
          "*.github*" \
          "README.md" \
          "composer.lock" \
          "tests/*" \
          "*.log"
          
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blog-deployment
        path: |
          deployment-package.zip
          database.sql
        retention-days: 30
