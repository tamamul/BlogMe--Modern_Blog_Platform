name: Build Blog Application

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: mbstring, ctype, filter, hash, iconv, pdo, pdo_mysql
      
    - name: Install dependencies
      run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress
      
    - name: Create database dump
      run: |
        mysqldump -h ${{ secrets.DB_HOST }} -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASS }} ${{ secrets.DB_NAME }} > database.sql 2>/dev/null || echo "Database dump failed, creating template"
        
        if [ ! -s "database.sql" ]; then
          cat > database.sql << 'EOF'
-- Blog Database Template
CREATE TABLE IF NOT EXISTS users (
    id INT AUTO_INCREMENT PRIMARY KEY,
    username VARCHAR(50) UNIQUE NOT NULL,
    email VARCHAR(100) UNIQUE NOT NULL,
    password VARCHAR(255) NOT NULL,
    role ENUM('admin','author') DEFAULT 'author',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE IF NOT EXISTS posts (
    id INT AUTO_INCREMENT PRIMARY KEY,
    title VARCHAR(255) NOT NULL,
    content TEXT NOT NULL,
    author_id INT NOT NULL,
    status ENUM('published','draft') DEFAULT 'draft',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);
EOF
        fi
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        
    - name: Create package
      run: |
        zip -r blog-package.zip . -x "*.git*" "*.github*" "README.md" "composer.lock"
        
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: blog-package
        path: |
          blog-package.zip
          database.sql
